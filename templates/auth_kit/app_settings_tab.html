{% load l10n %}
<form action="{% url 'core:settings' %}" method="POST" class="card shadow-sm rounded-4">
    {% csrf_token %}
    <input type="hidden" name="next_tab" value="app">
    <div class="card-body p-3 p-md-4 d-flex flex-column gap-3">
        <div class="accordion" id="buckezzAppAccordion">
            <!-- 1. Meilensteine & Alexa -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#accAppPersonal" aria-expanded="true" aria-controls="accAppPersonal">
                        <i class="bi bi-cake2 me-2 text-primary"></i>Meilensteine &amp; Haushalts-Steuerung
                    </button>
                </h2>
                <div id="accAppPersonal" class="accordion-collapse collapse show" data-bs-parent="#buckezzAppAccordion">
                    <div class="accordion-body">
                        <div class="row g-3">
                            <div class="col-12 col-md-4">
                                <label class="form-label fw-semibold">Geburtsdatum</label>
                                <input type="date" name="birth_date" class="form-control" value="{{ person.birth_date|date:'Y-m-d' }}">
                                <div class="form-text">Für altersbasierte Meilensteine in Bucket-Listen.</div>
                            </div>
                            <div class="col-12 col-md-8">
                                <label class="form-label fw-semibold">Alexa User ID (für Haushalts-Steuerung)</label>
                                <input type="text" name="alexa_user_id" class="form-control" value="{{ settings.alexa_user_id|default:'' }}" placeholder="z.B. amzn1.ask.account.AM3B...">
                                <div class="form-text">Zu finden im <a href="/api/alexa-log/" target="_blank">Alexa-Log</a> nach dem ersten Skill-Aufruf.</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 2. Gym & Sport -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#accAppGym" aria-expanded="false" aria-controls="accAppGym">
                        <i class="bi bi-activity me-2 text-primary"></i>Gym &amp; Sport-Einstellungen
                    </button>
                </h2>
                <div id="accAppGym" class="accordion-collapse collapse" data-bs-parent="#buckezzAppAccordion">
                    <div class="accordion-body">
                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Aktuelles Körpergewicht (kg)</label>
                                <input type="number" step="0.1" name="gym_weight" class="form-control" value="{% if settings.gym_weight %}{{ settings.gym_weight|unlocalize }}{% endif %}">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-semibold">Fitness-Ziel</label>
                                <input type="text" name="gym_fitness_goal" class="form-control" value="{{ settings.gym_fitness_goal|default:'' }}" placeholder="z.B. Muskelaufbau, Marathon">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Link zum Ernährungsplan (URL)</label>
                                <input type="url" name="gym_nutrition_plan_url" placeholder="https://..." class="form-control" value="{{ settings.gym_nutrition_plan_url|default:'' }}">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label fw-semibold">Plan-Anpassung</label>
                                <select name="gym_plan_adaptation_weeks" class="form-select">
                                    <option value="2" {% if settings.gym_plan_adaptation_weeks == 2 %}selected{% endif %}>2 Wochen</option>
                                    <option value="4" {% if settings.gym_plan_adaptation_weeks == 4 %}selected{% endif %}>4 Wochen</option>
                                    <option value="6" {% if settings.gym_plan_adaptation_weeks == 6 %}selected{% endif %}>6 Wochen</option>
                                    <option value="8" {% if settings.gym_plan_adaptation_weeks == 8 %}selected{% endif %}>8 Wochen</option>
                                    <option value="12" {% if settings.gym_plan_adaptation_weeks == 12 %}selected{% endif %}>12 Wochen</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-8">
                                <label class="form-label fw-semibold">Erinnerungs-Meldung</label>
                                <input type="text" name="gym_plan_adaptation_message" class="form-control" value="{{ settings.gym_plan_adaptation_message|default:'Bitte melde dich beim Trainer für einen neuen Plan, damit die Fortschritte möglich sind.' }}">
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label fw-semibold small text-muted">Körpermaße (cm)</label>
                            <div class="row g-2">
                                <div class="col-6 col-sm-3"><input type="text" name="measure_brust" placeholder="Brust" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.brust|default:'' }}"></div>
                                <div class="col-6 col-sm-3"><input type="text" name="measure_ruecken" placeholder="Rücken" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.ruecken|default:'' }}"></div>
                                <div class="col-6 col-sm-3"><input type="text" name="measure_arm_l" placeholder="Arm L" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.arm_l|default:'' }}"></div>
                                <div class="col-6 col-sm-3"><input type="text" name="measure_arm_r" placeholder="Arm R" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.arm_r|default:'' }}"></div>
                                <div class="col-6 col-sm-4"><input type="text" name="measure_bauch" placeholder="Bauch" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.bauch|default:'' }}"></div>
                                <div class="col-6 col-sm-4"><input type="text" name="measure_bein_l" placeholder="Bein L" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.bein_l|default:'' }}"></div>
                                <div class="col-6 col-sm-4"><input type="text" name="measure_bein_r" placeholder="Bein R" class="form-control form-control-sm" value="{{ settings.gym_body_measurements_json.bein_r|default:'' }}"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. Kalender-Sync & App-Cache -->
            <div class="accordion-item">
                <h2 class="accordion-header">
                    <button class="accordion-button collapsed fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#accAppCalendar" aria-expanded="false" aria-controls="accAppCalendar">
                        <i class="bi bi-calendar3 me-2 text-primary"></i>Kalender-Sync &amp; App-Cache
                    </button>
                </h2>
                <div id="accAppCalendar" class="accordion-collapse collapse" data-bs-parent="#buckezzAppAccordion">
                    <div class="accordion-body d-flex flex-column gap-3">
                        <div class="row g-3">
                            <div class="col-12 col-sm-4">
                                <label class="form-label fw-semibold">Tagesansicht Start</label>
                                <select name="calendar_start_hour" class="form-select">
                                    <option value="0" {% if settings.calendar_start_hour == 0 %}selected{% endif %}>00:00 Uhr</option>
                                    <option value="6" {% if settings.calendar_start_hour == 6 %}selected{% endif %}>06:00 Uhr</option>
                                    <option value="7" {% if settings.calendar_start_hour == 7 %}selected{% endif %}>07:00 Uhr</option>
                                    <option value="8" {% if settings.calendar_start_hour == 8 %}selected{% endif %}>08:00 Uhr</option>
                                    <option value="9" {% if settings.calendar_start_hour == 9 %}selected{% endif %}>09:00 Uhr</option>
                                    <option value="10" {% if settings.calendar_start_hour == 10 %}selected{% endif %}>10:00 Uhr</option>
                                    <option value="12" {% if settings.calendar_start_hour == 12 %}selected{% endif %}>12:00 Uhr</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label class="form-label fw-semibold">Tagesansicht Ende</label>
                                <select name="calendar_end_hour" class="form-select">
                                    <option value="18" {% if settings.calendar_end_hour == 18 %}selected{% endif %}>18:00 Uhr</option>
                                    <option value="20" {% if settings.calendar_end_hour == 20 %}selected{% endif %}>20:00 Uhr</option>
                                    <option value="21" {% if settings.calendar_end_hour == 21 %}selected{% endif %}>21:00 Uhr</option>
                                    <option value="22" {% if settings.calendar_end_hour == 22 %}selected{% endif %}>22:00 Uhr</option>
                                    <option value="23" {% if settings.calendar_end_hour == 23 %}selected{% endif %}>23:00 Uhr</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label class="form-label fw-semibold">Sync-Intervall (iCal)</label>
                                <select name="calendar_refresh_interval" class="form-select">
                                    <option value="PT1M" {% if settings.calendar_refresh_interval == 'PT1M' %}selected{% endif %}>1 Minute</option>
                                    <option value="PT5M" {% if settings.calendar_refresh_interval == 'PT5M' %}selected{% endif %}>5 Minuten</option>
                                    <option value="PT15M" {% if settings.calendar_refresh_interval == 'PT15M' %}selected{% endif %}>15 Minuten (Standard)</option>
                                    <option value="PT30M" {% if settings.calendar_refresh_interval == 'PT30M' %}selected{% endif %}>30 Minuten</option>
                                    <option value="PT1H" {% if settings.calendar_refresh_interval == 'PT1H' %}selected{% endif %}>1 Stunde</option>
                                    <option value="PT2H" {% if settings.calendar_refresh_interval == 'PT2H' %}selected{% endif %}>2 Stunden</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="calendar_filter_tracker" id="cfg_tracker_app" {% if settings.calendar_filter_tracker %}checked{% endif %}>
                                <label class="form-check-label" for="cfg_tracker_app">Routinen (Tracker) standardmäßig anzeigen</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="calendar_filter_reminder" id="cfg_reminder_app" {% if settings.calendar_filter_reminder %}checked{% endif %}>
                                <label class="form-check-label" for="cfg_reminder_app">Erinnerungen standardmäßig anzeigen</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="calendar_filter_completed" id="cfg_completed_app" {% if settings.calendar_filter_completed %}checked{% endif %}>
                                <label class="form-check-label" for="cfg_completed_app">Erledigte Aufgaben standardmäßig anzeigen</label>
                            </div>
                        </div>
                        <div>
                            <button type="button" onclick="if('caches' in window){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));} window.location.reload(true);" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-clockwise me-1"></i>App-Cache leeren &amp; aktualisieren
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 pt-2">
            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                <i class="bi bi-save me-1"></i>App-Einstellungen speichern
            </button>
        </div>
    </div>
</form>
