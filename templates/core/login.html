{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
            <div class="card shadow-sm rounded-4 p-4">
        <div class="text-center mb-4">
            <div class="display-5 text-primary mb-2"><i class="bi bi-shield-lock"></i></div>
            <h2 class="h4 fw-bold mb-1">Anmelden</h2>
            <p class="text-muted small mb-0">Willkommen zurück bei Buckezz 2.0</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger small" role="alert">
                Dein Benutzername oder Passwort ist falsch. Bitte versuche es erneut.
            </div>
        {% endif %}

        <form method="POST" action="{% url 'core:login' %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Benutzername</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold">Passwort</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Einloggen</button>
            <input type="hidden" name="next" value="{{ next|default:'' }}">
        </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
