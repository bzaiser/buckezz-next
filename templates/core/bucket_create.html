{% extends 'base.html' %}

{% block content %}
<div class="px-0 px-sm-1 px-md-2 py-2">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item"><a href="{% url 'core:home' %}">Start</a></li>
                <li class="breadcrumb-item"><a href="{% url 'core:dashboard' %}">Buckets</a></li>
                <li class="breadcrumb-item active" aria-current="page">Neuer Bucket</li>
            </ol>
        </nav>
        <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Zurück
        </a>
    </div>

    <form class="card shadow-sm rounded-4" action="{% url 'core:list_create' %}" method="POST">
        {% csrf_token %}
        <div class="card-header py-3">
            <h1 class="h5 fw-bold mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Neuen Bucket erstellen</h1>
        </div>
        <div class="card-body p-3 p-md-4">
            <label class="form-label fw-semibold mb-2">1. Vorlage auswählen</label>
            <div class="row g-2">
                {% for cat in categories %}
                <div class="col-6 col-sm-4 col-md-3">
                    <input type="radio" class="btn-check" name="category_id" id="page_cat_{{ cat.id }}" value="{{ cat.id }}" required>
                    <label class="btn btn-outline-primary w-100 h-100 d-flex flex-column align-items-center justify-content-center p-3 rounded-3" for="page_cat_{{ cat.id }}">
                        <span class="fs-3 mb-1">
                            {% if cat.icon|slice:":3" == "bi-" %}<i class="bi {{ cat.icon }}"></i>{% else %}{{ cat.icon }}{% endif %}
                        </span>
                        <span class="small fw-semibold">{{ cat.name }}</span>
                    </label>
                </div>
                {% endfor %}
            </div>
        </div>
        <div class="card-footer p-3 p-md-4 d-flex flex-column flex-md-row align-items-stretch align-items-md-end gap-2">
            <div class="flex-grow-1">
                <label class="form-label fw-semibold mb-1">2. Name des Buckets</label>
                <input type="text" name="title" placeholder="z.B. Wocheneinkauf" required class="form-control">
            </div>
            <div class="d-flex gap-2 justify-content-end">
                <a href="{% url 'core:dashboard' %}" class="btn btn-outline-secondary">Abbrechen</a>
                <button type="submit" class="btn btn-primary px-4">Erstellen</button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
