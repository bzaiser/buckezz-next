services:
  web:
    build: .
    image: ${IMAGE_NAME:-buckezz_image}
    container_name: ${CONTAINER_NAME:-buckezz_web}
    restart: unless-stopped
    volumes:
      - .:/app
      - ${DB_DIR:-./data}:/app/data
    ports:
      - "${WEB_PORT:-8006}:8000"
    env_file:
      - .env
    command: sh -c "exec ${START_COMMAND:-gunicorn buckezz_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 2}"
